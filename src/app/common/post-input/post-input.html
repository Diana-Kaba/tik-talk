<div class="create-post">
  <div class="avatar-container">
    <img [src]="getAvatarUrl()" alt="Avatar" class="profile-avatar" />
  </div>
  <input
    type="text"
    placeholder="Напишіть пост..."
    id="postContent"
    [(ngModel)]="postText"
    (keyup.enter)="onSendPost()"
  />
  <button class="btn-send" (click)="onSendPost()">
    <svg icon="send" class="send"></svg>
  </button>
</div>
