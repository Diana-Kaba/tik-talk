<form class="create-post" [formGroup]="postForm" (ngSubmit)="onSendPost()">
  <div class="avatar-container">
    <img [src]="getAvatarUrl()" alt="Avatar" class="profile-avatar" />
  </div>
  <div class="inputs">
    <input
      type="text"
      placeholder="Тема (необов'язкова)"
      class="base-input title-input"
      formControlName="title"
    />
    <input
      type="text"
      placeholder="Напишіть пост..."
      id="postContent"
      class="base-input"
      formControlName="text"
    />
  </div>

  <button class="btn-send" type="submit" [disabled]="postForm.invalid">
    <svg icon="send" class="send"></svg>
  </button>
</form>
